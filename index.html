<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Идеальный телефон</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Oswald:wght@500;700&display=swap">
<style>
/* Layout: the phone is always visible (sticky on top on phones, on the right on wide screens); one step at a time below it */
:root{
  --sky-a:#CFE3F5; --sky-b:#F7DCE4; --ink:#211D18; --muted:#5B5248; --accent:#B8402A; --accent-ink:#FFFFFF;
  --panel:rgba(255,255,255,.78); --line:rgba(33,29,24,.18); --chip:#FFFFFF; --chip-on:#211D18; --chip-on-ink:#FFFFFF;
  --font-h:'Oswald','Arial Narrow',sans-serif; --font-b:'Manrope',Arial,sans-serif; --s:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-a:#1F2A3D; --sky-b:#3B2B3E; --ink:#F4EDE4; --muted:#C3B8AD; --accent:#F29A80; --accent-ink:#211D18;
  --panel:rgba(20,18,28,.66); --line:rgba(244,237,228,.24); --chip:#2A2536; --chip-on:#F4EDE4; --chip-on-ink:#211D18; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-a:#1F2A3D; --sky-b:#3B2B3E; --ink:#F4EDE4; --muted:#C3B8AD; --accent:#F29A80; --accent-ink:#211D18;
  --panel:rgba(20,18,28,.66); --line:rgba(244,237,228,.24); --chip:#2A2536; --chip-on:#F4EDE4; --chip-on-ink:#211D18; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--sky-a),var(--sky-b)) fixed;background-color:var(--sky-a);color:var(--ink);font-family:var(--font-b);font-size:18px;line-height:1.35;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--font-h);font-weight:700;font-size:clamp(40px,8vw,84px);line-height:1.04;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px;backdrop-filter:blur(6px)}
.dots{display:flex;gap:8px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
h2{font-family:var(--font-h);font-weight:700;font-size:clamp(30px,6vw,40px);line-height:1.05;text-transform:uppercase;margin:0}
.hint{margin:0;color:var(--muted);font-size:17px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button,.btn{font:inherit;font-weight:800;font-size:17px;min-height:48px;padding:0 16px;border-radius:14px;border:2px solid var(--ink);background:var(--chip);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.ghost{border-color:var(--line)}
.left{display:grid;gap:16px;min-width:0}
.nav{display:flex;gap:10px}
.nav .btn{min-height:64px;font-size:21px}
.nav{position:sticky;bottom:0;padding:10px 0 12px;background:linear-gradient(to top,var(--sky-b) 70%,transparent)}
.zoom{display:none}
.sub{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:4px 0 -6px}
.pow{display:grid;grid-template-columns:34px 1fr 28px;gap:2px 12px;align-items:center;text-align:left;width:100%;font:inherit;background:var(--chip);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:8px 12px;cursor:pointer}
.pow[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.pow svg{grid-row:1/3;width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pow b{font-size:18px}.pow span{font-size:14px;font-weight:500;opacity:.85;line-height:1.25}
.pows{display:grid;gap:8px}
.pow::after{content:'';grid-row:1/3;grid-column:3;width:26px;height:26px;border-radius:7px;border:3px solid currentColor;display:grid;place-items:center;font-weight:800;font-size:18px;line-height:1}
.pow[aria-pressed="true"]::after{content:'\2713';background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sample{font-weight:800;margin:0}
input.name{font:inherit;font-weight:700;font-size:20px;min-height:56px;border-radius:14px;border:2px solid var(--ink);padding:0 16px;background:var(--chip);color:var(--ink);width:100%}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card-img{width:100%;max-width:420px;height:auto;border-radius:16px;justify-self:center;border:1px solid var(--line);display:block}
.save{font-weight:800;color:var(--accent);margin:0;text-align:center}
/* phone */
.phone-col{position:sticky;top:16px}
.phone-box{width:calc(340px*var(--s));height:calc(624px*var(--s));margin:0 auto}
.phone{width:340px;background:#15121A;border-radius:46px;padding:12px;box-shadow:0 24px 50px rgba(40,30,60,.35);transform:scale(var(--s));transform-origin:0 0}
.screen{position:relative;border-radius:36px;overflow:hidden;height:600px;background:var(--scr-bg);color:var(--scr-ink);display:flex;flex-direction:column;
  --scr-bg:linear-gradient(170deg,#F7D6C8,#BFD6F0);--scr-ink:#211D18;--scr-card:rgba(255,255,255,.85);--scr-line:rgba(33,29,24,.15)}
.screen.dark{--scr-bg:linear-gradient(170deg,#2B2438,#141B2C);--scr-ink:#F4EDE4;--scr-card:rgba(255,255,255,.12);--scr-line:rgba(255,255,255,.2)}
.status{display:flex;justify-content:space-between;padding:12px 22px 4px;font-weight:800;font-size:13px}
.home{overflow:hidden;flex:1;padding:6px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.clock{font-family:var(--font-h);font-size:50px;font-weight:700;line-height:1;margin:2px 0 0}
.date{font-size:calc(13px*var(--k));font-weight:700;margin:0}
.grid{display:grid;align-items:start;grid-template-columns:repeat(var(--cols),1fr);gap:10px 6px;margin-top:auto;align-content:end}
.app{display:grid;justify-items:center;align-content:start;gap:4px;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer;min-width:0}
.tile{width:var(--tile);height:var(--tile);display:grid;place-items:center}
.tile svg{width:55%;height:55%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.screen[data-shape="round"] .tile{border-radius:50%}
.screen[data-shape="square"] .tile{border-radius:22%}
.screen[data-shape="sharp"] .tile{border-radius:3px}
.app .lbl{font-size:var(--lbl,11px);font-weight:800;line-height:1.1;text-align:center;max-width:100%;white-space:nowrap}
.app.pulse .tile{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,64,42,.8)}100%{box-shadow:0 0 0 16px rgba(184,64,42,0)}}
@media (prefers-reduced-motion:reduce){.app.pulse .tile{animation:none;outline:3px solid #B8402A}}
.dock{display:flex;flex-wrap:wrap;gap:6px}
.dock button{display:flex;align-items:center;gap:6px;font:inherit;font-weight:800;font-size:calc(11px*var(--k));background:var(--scr-card);color:var(--scr-ink);border:1px solid var(--scr-line);border-radius:999px;padding:6px 10px;cursor:pointer}
.dock svg{width:calc(14px*var(--k));height:calc(14px*var(--k));fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button.sos{background:#B8402A;color:#fff;border-color:#B8402A}
.settings{position:absolute;inset:0;background:var(--scr-bg);display:none;flex-direction:column}
.settings.on{display:flex}
.sh{display:flex;align-items:center;gap:10px;padding:8px 14px 6px}
.back{font:inherit;font-weight:800;font-size:calc(13px*var(--k));background:var(--scr-card);color:var(--scr-ink);border:1px solid var(--scr-line);border-radius:12px;padding:8px 12px;cursor:pointer}
.sh h3{margin:0;font-family:var(--font-h);font-size:calc(20px*var(--k));text-transform:uppercase}
.search{margin:6px 14px;display:flex;align-items:center;gap:8px;background:var(--scr-card);border:1px solid var(--scr-line);border-radius:14px;padding:0 12px}
.search svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;font-weight:700;font-size:calc(15px*var(--k));padding:12px 0}
.search input::placeholder{color:inherit;opacity:.55}
.list{flex:1;overflow:auto;padding:6px 14px 14px;display:grid;gap:8px;align-content:start}
.row{font:inherit;text-align:left;background:var(--scr-card);color:var(--scr-ink);border:1px solid var(--scr-line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:calc(15px*var(--k));cursor:pointer}
.row small{display:block;font-weight:500;opacity:.7;font-size:calc(12px*var(--k))}
.empty{padding:14px;font-weight:700;opacity:.75;font-size:calc(14px*var(--k))}
.toast{position:absolute;left:14px;right:14px;bottom:14px;background:#2F6B3F;color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;font-size:calc(13px*var(--k));display:none}
.toast.on{display:block}
.screen{isolation:isolate}
.edu{margin:0;font-size:15px;font-weight:600;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--muted)}
.edu b{color:var(--ink)}
.mainbtn{display:none;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:800;font-size:calc(17px*var(--k));color:#fff;border:0;border-radius:18px;min-height:52px;padding:0 14px;cursor:pointer}
.mainbtn.on{display:flex}
.mainbtn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nophone .phone-col{display:none}
.nophone .main{grid-template-columns:minmax(0,1fr)}
.nophone .card-img{max-width:560px}
.screen.skyon{--scr-ink:#211D18;--scr-card:rgba(255,255,255,.85);--scr-line:rgba(33,29,24,.15)}
.screen.skyon::before{content:'';position:absolute;inset:-12%;z-index:-1;background:var(--sky-img) center/cover;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%) scale(1.05)}to{transform:translateX(4%) scale(1.12)}}
.spark{position:absolute;width:12px;height:12px;background:#FFD66B;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;z-index:6;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(120deg);opacity:0}}
.bloom{position:absolute;right:14px;top:44px;width:64px;display:none;justify-items:center;gap:2px;pointer-events:none}
.bloom.on{display:grid}
.bloom svg{width:56px;height:56px;transform-origin:50% 90%;animation:bloom 2.4s ease-out both}
.bloom span{font-size:10px;font-weight:800;text-align:center;line-height:1.1}
@keyframes bloom{from{transform:scale(.1) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.buddy{position:absolute;left:14px;right:14px;top:112px;display:none;gap:8px;align-items:center;pointer-events:none}
.buddy.on{display:flex}
.buddy svg{flex:none;width:34px;height:34px;fill:#fff;stroke:#8AA8C8;stroke-width:1.5}
.buddy p{margin:0;background:var(--scr-card);border:1px solid var(--scr-line);border-radius:12px;padding:6px 10px;font-size:11px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){.screen.skyon::before,.bloom svg{animation:none}}
.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.heroes.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hero{font:inherit;text-align:left;padding:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--chip);color:var(--ink);cursor:pointer}
.hero img{width:100%;display:block;aspect-ratio:1;object-fit:cover;object-position:center 20%}
.hero img.tall{aspect-ratio:1.3;object-position:center}
.hero span{display:block;padding:5px 6px 7px;text-align:center}
.hero b{font-size:15px;display:block;line-height:1.2}
.hero small{display:block;font-size:13px;font-weight:500;line-height:1.25;color:var(--muted)}
.hero[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.who{display:flex;gap:12px;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.who img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
.who b{display:block}.who span{font-size:15px;font-weight:500;color:var(--muted)}
.say{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px;border:2px solid var(--ink);background:var(--chip)}
.say img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none}
.say p{margin:0}.say b{display:block;font-size:20px}.say span{font-size:16px;font-weight:500}
.say.good{border-color:#2F6B3F}.say.bad{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.zone{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,rgba(47,150,80,.75),rgba(47,150,80,0));pointer-events:none;display:none;align-items:flex-end;justify-content:center;padding-bottom:6px;color:#fff;font-weight:800;font-size:15px}
.zone.on{display:flex}
.far{position:absolute;left:0;right:0;top:0;background:rgba(20,18,28,.5);display:none;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;text-align:center;pointer-events:none;padding:0 24px}
.far.on{display:flex}
.navbar{display:none;gap:8px}
.navbar.on{display:flex}
.navbar button{flex:1;font:inherit;font-weight:800;font-size:calc(12px*var(--k));background:var(--scr-card);color:var(--scr-ink);border:1px solid var(--scr-line);border-radius:12px;padding:8px;cursor:pointer}
.here{margin:0 14px;font-size:calc(12px*var(--k));font-weight:800;opacity:.75;display:none}
.here.on{display:block}
.app.tap .tile{transform:scale(.86);filter:brightness(1.3);transition:transform .12s}
.screen.nolbl .lbl{display:none}
@media (max-width:820px){
  :root{--s:.5}
  body{padding-block:0;height:100vh;height:100dvh;overflow:hidden}
  .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:0;max-width:none}
  header{display:none}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:0}
  .phone-col{order:-1;flex:none;position:relative;padding:10px 0 8px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:var(--sky-a);border-bottom:1px solid var(--line)}
  .left{flex:1;min-height:0;display:flex;flex-direction:column;gap:0}
  #step{flex:1;min-height:0;overflow:auto;border-radius:0;border:0;border-bottom:1px solid var(--line);padding:16px 0;background:transparent;backdrop-filter:none}
  #step{gap:10px;padding:10px 0}
  #step h2{font-size:28px}
  #step .hint{font-size:15px}
  #step .kicker{font-size:12px}
  .who{padding:6px 10px;gap:10px}.who img{width:36px;height:36px}.who span{font-size:13px}.who b{font-size:15px}
  .say{padding:10px;gap:10px}.say img{width:52px;height:52px}.say b{font-size:18px}.say span{font-size:15px}
  .dots i{height:4px}
  .nav{flex:none;position:static;background:none;padding:10px 0 max(12px,env(safe-area-inset-bottom,0px))}
  .zoom{display:flex;align-items:center;gap:8px;position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);flex-direction:column;font:inherit;font-weight:800;font-size:15px;background:var(--chip);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:10px 8px;min-width:84px;cursor:pointer}
  .zoom svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .phone-col.big{position:fixed;inset:0;z-index:50;margin:0;display:grid;align-content:center;justify-items:center;padding:16px;border:0}
  .phone-col.big .zoom{top:auto;bottom:max(14px,env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);flex-direction:row;font-size:20px;min-width:200px;justify-content:center}
}
</style>

<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
